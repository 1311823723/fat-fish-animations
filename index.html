<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>大肥鱼动画库</title><link rel="stylesheet" href="preview.css"></head>
<body><main><header><span class="eyebrow">FAT FISH ANIMATIONS</span><h1>肥鱼的换装放映室</h1><p>5 套衣服，85 项动作。选一套，看看她怎么动。</p></header><div class="layout"><section class="stage"><canvas id="stage" width="600" height="640" aria-label="动画预览"></canvas><output id="status" aria-live="polite">正在读取目录…</output></section><section class="controls"><label>衣服或扩展<select id="pack"></select></label><div id="outfits" class="outfits"></div><label>动作<select id="action"></select></label><div class="row"><label>播放速度<select id="speed"><option value="0.5">0.5 倍</option><option value="1" selected>1 倍</option><option value="2">2 倍</option></select></label><label class="check"><input id="loop" type="checkbox" checked>循环播放</label></div><div class="row"><button id="pause">暂停</button><button id="replay">重新播放</button><button id="step">下一帧</button></div><p id="info"></p><p class="muted">棋盘格表示透明背景。单次动作默认只播一次；选择“循环播放”可反复检查。</p><a href="docs/FORMAT.md">素材格式</a> · <a href="ATTRIBUTION.md">署名与使用范围</a></section></div><footer>非官方 AI 辅助二创 · 角色原设计：上善无形；女仆版：ZipZipPipe · 素材遵循 CC BY-NC-SA 4.0</footer></main><script type="module" src="preview.js"></script></body></html>
